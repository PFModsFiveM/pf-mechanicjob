<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap" style="display:none">
    <div id="tablet">
      <div id="titlebar">
        <div class="brand">
          <img id="logoPrev" alt="" />
          <div>
            <div class="name">Mechanic Shop</div>
            <div class="sub">Service & Performance</div>
          </div>
        </div>
        <div id="rankbox">Rank 1 <span class="bar"><span></span></span></div>
        <div class="actions">
          <button id="npcToggle" class="btn-secondary">Start NPC Jobs</button>
          <button id="closeBtn" class="btn">Close</button>
        </div>
      </div>

      <div id="dock">
        <button class="dock-item app" data-app="home">🏠</button>
        <button class="dock-item app" data-app="npc">🛠</button>
        <button class="dock-item app" data-app="pos">🧾</button>
        <button class="dock-item app" data-app="boss">🏢</button>
      </div>

      <!-- NPC -->
      <div id="npc" class="view">
        <h3>NPC Jobs</h3>
        <div class="cols">
          <div class="col">
            <h4>NEW JOBS</h4>
            <div id="newJobs"></div>
          </div>
          <div class="col">
            <h4>ACTIVE</h4>
            <div id="activeJobs"></div>
          </div>
          <div class="col">
            <h4>STOCK</h4>
            <div id="stock"></div>
            <button id="orderOil" class="btn">Order Oil x5</button>
          </div>
        </div>
      </div>

      <!-- POS -->
      <div id="pos" class="view" style="display:none">
        <h3>Cash Register</h3>
        <div class="pos-grid">
          <div>
            <div id="posTabs" class="seg"></div>
            <div id="posItems" class="items"></div>
          </div>
          <div class="cart">
            <h4>Cart</h4>
            <div id="cartList"></div>
            <div class="line"><span>Subtotal</span><span id="sub">$0.00</span></div>
            <div class="line"><span>Tax</span><span id="tax">$0.00</span></div>
            <div class="line big"><span>Total</span><span id="tot">$0.00</span></div>
            <div class="row gap">
              <button id="cartClear" class="btn-secondary">Clear</button>
              <button id="cartPay" class="btn">Process Payment</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Boss -->
      <div id="boss" class="view" style="display:none">
        <h3>Management</h3>
        <div class="grid2">
          <div class="card">
            <label>Business Name</label>
            <input id="bizName" type="text" value="Mechanic Shop" />
            <label>Primary Color</label>
            <input id="colorPrimary" type="color" value="#0BA378" />
            <label>Secondary Color</label>
            <input id="colorSecondary" type="color" value="#0B2E44" />
            <label>Logo URL</label>
            <input id="logoUrl" type="text" placeholder="https://..." />
            <label>Status</label>
            <select id="bizOpen">
              <option value="1">OPEN</option>
              <option value="0">CLOSED</option>
            </select>
            <button id="saveBiz" class="btn">Save Changes</button>
          </div>
          <div class="card">
            <h4>Employees</h4>
            <div id="empList"></div>
          </div>
        </div>
      </div>

      <div id="home" class="view" style="display:none"></div>
    </div>

    <!-- Modals -->
    <div id="picker" class="modal">
      <div class="panel">
        <h4>Select customer</h4>
        <div id="pickList"></div>
        <button id="pickCancel" class="btn-secondary">Cancel</button>
      </div>
    </div>
    <div id="payPrompt" class="modal">
      <div class="panel">
        <h4 id="ppTitle">Payment</h4>
        <div id="ppItems"></div>
        <div class="line"><span>Subtotal</span><span id="ppSub">$0.00</span></div>
        <div class="line"><span>Tax</span><span id="ppTax">$0.00</span></div>
        <div class="line big"><span>Total</span><span id="ppTot">$0.00</span></div>
        <div class="row gap end">
          <button id="ppDecline" class="btn-secondary">Decline</button>
          <button id="ppCash" class="btn">Pay Cash</button>
          <button id="ppCard" class="btn">Pay Card</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
